<header class="topbar">
  <button class="hamburger" (click)="abrirMenu.emit()" aria-label="Abrir menú">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>

  <div class="title-block">
    <h1>Panel administrativo</h1>
  </div>

  <div class="topbar-actions">
    <div class="user-chip">
      <span class="user-chip-name">{{ currentUser()?.nombre }}</span>
    </div>
    <button class="logout-btn" (click)="cerrarSesion()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      <span>Cerrar sesión</span>
    </button>
  </div>
</header>
