<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [style]="{ width: '400px' }"
  header="Cambiar contraseña"
  [draggable]="false"
  [dismissableMask]="true"
>
  <form [formGroup]="form" (ngSubmit)="guardar()" class="password-form">
    <p class="subtitulo">{{ subtitulo() }}</p>

    <div class="campo">
      <label for="nuevaPassword">Nueva contraseña</label>
      <p-password
        inputId="nuevaPassword"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        placeholder="Mínimo 8 caracteres"
        styleClass="w-full"
        [inputStyle]="{ width: '100%' }"
      />
    </div>

    @if (errorMensaje()) {
      <p class="error">{{ errorMensaje() }}</p>
    }

    <div class="acciones">
      <p-button label="Cancelar" severity="secondary" [text]="true" type="button" (onClick)="cerrar()" />
      <p-button label="Guardar contraseña" [loading]="cargando()" type="submit" />
    </div>
  </form>
</p-dialog>
