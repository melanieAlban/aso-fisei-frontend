<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [style]="{ width: '400px' }"
  header="Registrar abono"
  [draggable]="false"
  [dismissableMask]="true"
>
  <p class="subtitulo">{{ compromiso()?.descripcion }} · pendiente {{ pendiente() | number: '1.2-2' }}</p>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="form">
    <div class="campo">
      <label for="monto">Monto a abonar</label>
      <div class="campo-monto">
        <span>$</span>
        <input id="monto" type="text" inputmode="decimal" formControlName="monto" placeholder="0.00" />
      </div>
    </div>

    <div class="campo">
      <label>Método de pago</label>
      <div class="toggle-row">
        <button type="button" class="toggle" [class.active]="metodoPago() === 'EFECTIVO'" (click)="elegirEfectivo()">Efectivo</button>
        <button type="button" class="toggle" [class.active]="metodoPago() === 'TRANSFERENCIA'" (click)="elegirTransferencia()">Transferencia</button>
      </div>
    </div>

    @if (errorMensaje()) {
      <p class="error">{{ errorMensaje() }}</p>
    }

    <div class="acciones">
      <p-button label="Cancelar" severity="secondary" [text]="true" type="button" (onClick)="cerrar()" />
      <p-button label="Abonar" [loading]="cargando()" [disabled]="form.invalid" type="submit" />
    </div>
  </form>
</p-dialog>
